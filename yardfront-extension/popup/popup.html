<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>YardFront</title>
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #0A0A0A;
    }
    .hidden { display: none; }
    #sign-in-view button, .btn {
      width: 100%;
      padding: 10px 16px;
      background: #0A0A0A;
      color: white;
      border: none;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    #sign-in-view button:hover, .btn:hover { opacity: 0.9; }
    #logged-in-view h3 { margin: 0 0 12px 0; font-size: 16px; }
    .usage-hint {
      margin: 12px 0 0 0;
      font-size: 12px;
      color: #6B6B6B;
    }
    .sign-out {
      margin-top: 12px;
      background: transparent;
      color: #6B6B6B;
      font-size: 13px;
      cursor: pointer;
      border: none;
      text-decoration: underline;
    }
    .sign-out:hover { color: #0A0A0A; }
  </style>
</head>
<body>
  <div id="sign-in-view" class="hidden">
    <p style="margin-bottom: 12px;">Sign in to see price badges on Craigslist, eBay, and Amazon.</p>
    <button id="sign-in" data-action="sign-in">Sign In</button>
  </div>
  <div id="logged-in-view" class="hidden">
    <h3>YardFront</h3>
    <p>You're signed in. Badges appear on marketplace pages.</p>
    <p id="usage-counter" class="usage-hint"></p>
    <button class="sign-out" id="sign-out">Sign Out</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
